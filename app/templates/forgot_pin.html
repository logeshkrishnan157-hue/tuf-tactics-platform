{% extends "base.html" %}
{% block title %}Reset PIN - TufTactics{% endblock %}
{% block content %}
<div class="w-full max-w-md mx-auto glass-card p-8 sm:p-10 rounded-3xl shadow-2xl">
    <div class="text-center mb-8"><h2 class="text-2xl font-extrabold mb-2">Reset 4-Digit PIN</h2><p class="text-sm text-slate-500 dark:text-slate-400">Verify your registered details to set a new PIN</p></div>
    {% if error %}<div class="mb-6 p-4 bg-rose-500/10 border border-rose-500/20 text-rose-600 dark:text-rose-300 text-xs rounded-2xl text-center font-semibold">{{ error }}</div>{% endif %}
    <form method="POST" class="space-y-4">
        <div><label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Registered Email or Phone</label><input type="text" name="identifier" required class="w-full px-4 py-3.5 glass-input rounded-2xl focus:outline-none text-sm font-medium" placeholder="user@example.com or 9876543210"></div>
        <div><label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Registered Full Name</label><input type="text" name="name" required class="w-full px-4 py-3.5 glass-input rounded-2xl focus:outline-none text-sm font-medium" placeholder="Lokesh Krishan"></div>
        <div><label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">New 4-Digit PIN</label><input type="password" name="new_pin" minlength="4" maxlength="4" pattern="\d{4}" required oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);" class="w-full px-4 py-3.5 glass-input rounded-2xl focus:outline-none tracking-widest text-center text-lg font-bold" placeholder="••••"></div>
        <button type="submit" class="w-full py-4 theme-btn-bg font-bold rounded-2xl transition shadow-xl mt-4 text-white">Update PIN ➔</button>
    </form>
    <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">Remembered your PIN? <a href="/login" class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline">Sign In</a></p>
</div>
{% endblock %}
